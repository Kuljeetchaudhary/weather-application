<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Miranda+Sans:ital@0;1&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:wght@601&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
 <link rel="stylesheet" href="style.css">
  </head>
  <body>
   <div class="card">
    <div class="search">
        <input  placeholder="Enter city name" spellcheck="false" type="text">
        <button id="click"><i class="fa-solid fa-magnifying-glass "></i></button>
    </div>
    <div class="error">
        <p>Your Input is Wrong</p>
    </div>
    <div class="weather">
    <img class="weather-icon" src="https://i.pinimg.com/1200x/68/f3/07/68f3078658308707c8b781de90f26c6e.jpg" alt="image"   style="margin-top:20px;" height="150px" width="150px">
    <h1 class="temp">22°c</h1>
    <h2 class="city">New York</h2>
    <div class="details">
        <div class="col">
          <i class="fa-solid fa-droplet-slash"></i>
            <div>
                <p class="humidity">50%</p>
                <p>Humidity</p>
            </div>
            </div>
              <div class="col">
                <i class="fa-solid fa-wind"></i>
            <div>
                <p class="wind">150 kmph</p>
                <p>Wind Speed</p>
            </div>
           
        </div>
    </div>
   </div>

    
   </div>
   

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
